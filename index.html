<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Pantalla de bienvenida interactiva para activar la música */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdf2f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #welcome-screen h1 {
            color: #d27d9a;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }
        .enter-btn {
            background: #d27d9a;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 430px;
            display: none; /* Se oculta al principio */
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        /* Zona interactiva calibrada exactamente sobre tu botón rosa */
        .maps-link {
            position: absolute;
            left: 26%;
            top: 75.8%;
            width: 48%;
            height: 6.5%;
            z-index: 20;
            cursor: pointer; 
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Entrada obligatoria para reproducir música automática -->
    <div id="welcome-screen">
        <h1>🎓 Estás invitado a la Graduación de Kenia</h1>
        <button class="enter-btn" onclick="startInvitation()">Abrir Invitación</button>
    </div>

    <!-- Contenedor principal de la Invitación -->
    <div class="container" id="main-content">
        <img class="invitation" src="Invitacion_Kenia_Boton_Maps_page-0001.JPG" alt="Invitación de Graduación de Kenia">
        <a class="maps-link" href="https://google.com" target="_blank"></a>
    </div>

    <!-- Elemento nativo de audio oculto en la web -->
    <audio id="bg-music" src="cancion.mp3" loop></audio>

    <script>
        function startInvitation() {
            // Reproduce la música de fondo al presionar el botón
            var music = document.getElementById("bg-music");
            music.play().catch(function(error) {
                console.log("Error al reproducir audio:", error);
            });

            // Oculta la pantalla de bienvenida y muestra la invitación
            document.getElementById("welcome-screen").style.opacity = "0";
            setTimeout(function() {
                document.getElementById("welcome-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }, 500);
        }
    </script>

</body>
</html>
