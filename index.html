<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 430px;
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
            /* Fuerza al navegador a no difuminar los bordes tipográficos */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        /* Zona interactiva calibrada exactamente sobre tu botón rosa */
        .maps-link {
            position: absolute;
            left: 26%;
            top: 75.8%;
            width: 48%;
            height: 6.5%;
            z-index: 20;
            cursor: pointer; 
            border-radius: 30px; /* Iguala la curvatura de tu botón */
        }
        .spotify-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #1DB954;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 18px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,.25);
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ACTUALIZACIÓN: Cambiado a formato .png de alta fidelidad visual -->
        <img class="invitation" src="invitacion.png" alt="Invitación de Graduación de Kenia">
        
        <!-- Enlace invisible acoplado sobre el botón rosa de ubicación -->
        <a class="maps-link" href="https://google.com" target="_blank"></a>
    </div>

    <!-- Enlace directo optimizado para la aplicación móvil de Spotify -->
    <a class="spotify-btn" href="spotify:track:0GjEhVFGZW8afUYGChu3Rr" target="_blank">
        🎵 Dancing Queen
    </a>

</body>
</html>
