<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        /* Pantalla de bienvenida interactiva obligatoria */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdf2f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #welcome-screen h1 {
            color: #d27d9a;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
        }
        .enter-btn {
            background: #d27d9a;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(210, 125, 154, 0.4);
        }
        /* Contenedor responsivo calibrado */
        .container {
            position: relative;
            width: 100%;
            max-width: 410px;
            height: auto;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            image-rendering: -webkit-optimize-contrast;
        }
        /* CAJA CON LA INFO DE LA FECHA FIJA */
        .date-box-container {
            position: absolute;
            left: 10%;
            bottom: 28%; /* Ubicado exactamente en la misma posición de la cuenta regresiva anterior */
            width: 80%;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(210, 125, 154, 0.2);
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .date-text-main {
            font-size: 16px;
            font-weight: bold;
            color: #d27d9a;
            letter-spacing: 0.5px;
        }
        /* Botón de Google Maps Clavado encima de tu zona rosa */
        .maps-link {
            position: absolute;
            left: 15%;
            bottom: 16.5%;
            width: 70%;
            height: 8.5%;
            z-index: 999;
            cursor: pointer;
            border-radius: 30px;
            background: transparent;
        }
    </style>
</head>
<body>
    <!-- Pantalla de entrada para activar música -->
    <div id="welcome-screen">
        <h1>🎓 Estás invitado a la<br>Graduación de Kenia</h1>
        <button class="enter-btn" onclick="startInvitation()">Abrir Invitación</button>
    </div>

    <!-- Invitación Principal -->
    <div class="container" id="main-content">
        <img class="invitation" src="Invitacion_Kenia_Boton_Maps_page-0001.jpg" onerror="this.src='Invitacion_Kenia_Boton_Maps_page-0001.JPG'" alt="Invitación">
        
        <!-- VISUALIZACIÓN FIJA DE LA FECHA -->
        <div class="date-box-container">
            <div class="date-text-main">📅 6 de Septiembre — 3:00 PM</div>
        </div>

        <!-- EL BOTÓN CON TU ENLACE DE MAPAS ACTUALIZADO -->
        <a class="maps-link" href="https://maps.app.goo.gl/XDd63DqmPNoqmbWw5" target="_blank"></a>
    </div>

    <!-- AUDIO VINCULADO CORRECTAMENTE A TU ARCHIVO LOCAL EN GITHUB -->
    <audio id="bg-music" loop preload="auto">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startInvitation() {
            // Activa de forma segura la música local 'cancion.mp3' guardada en tu repositorio
            var music = document.getElementById("bg-music");
            if (music) {
                music.play().catch(function(error) {
                    console.log("Interacción de audio bloqueada en consola:", error);
                });
            }

            var welcome = document.getElementById("welcome-screen");
            var content = document.getElementById("main-content");
            welcome.style.opacity = "0";
            welcome.style.visibility = "hidden";
            content.style.opacity = "1";
        }
    </script>
</body>
</html>
