<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Pantalla de bienvenida interactiva obligatoria */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdf2f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #welcome-screen h1 {
            color: #d27d9a;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
        }
        .enter-btn {
            background: #d27d9a;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(210, 125, 154, 0.4);
        }

        /* Contenedor responsivo fijo para evitar desfases de botones */
        .container {
            position: relative;
            width: 100%;
            max-width: 410px;
            height: auto;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            image-rendering: -webkit-optimize-contrast;
        }
        
        /* Botón de Google Maps Clavado Milimétricamente */
        .maps-link {
            position: absolute;
            left: 26%;
            bottom: 17.5%; /* Usamos bottom en lugar de top para evitar desfases en pantallas largas */
            width: 48%;
            height: 6.8%;
            z-index: 999;
            cursor: pointer; 
            border-radius: 30px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Pantalla de entrada -->
    <div id="welcome-screen">
        <h1>🎓 Estás invitado a la<br>Graduación de Kenia</h1>
        <button class="enter-btn" onclick="startInvitation()">Abrir Invitación</button>
    </div>

    <!-- Invitación Principal -->
    <div class="container" id="main-content">
        <!-- Imagen vinculada mediante doble verificación de extensión -->
        <img class="invitation" src="Invitacion_Kenia_Boton_Maps_page-0001.jpg" onerror="this.src='Invitacion_Kenia_Boton_Maps_page-0001.JPG'" alt="Invitación">
        
        <!-- Enlace universal garantizado a tu ubicación en Naucalpan -->
        <a class="maps-link" href="https://google.com" target="_blank"></a>
    </div>

    <!-- Elemento físico de Audio con doble lectura de compatibilidad móvil -->
    <audio id="bg-music" loop preload="auto">
        <source src="Cancion.mp3" type="audio/mpeg">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startInvitation() {
            var music = document.getElementById("bg-music");
            
            // Intenta reproducir el elemento directamente
            music.play().then(function() {
                console.log("Audio activado");
            }).catch(function(error) {
                console.log("Bloqueo de audio detectado, reintentando...", error);
                // Intento alternativo forzando recarga de contexto
                music.load();
                music.play();
            });

            // Transición de pantallas
            var welcome = document.getElementById("welcome-screen");
            var content = document.getElementById("main-content");
            
            welcome.style.opacity = "0";
            welcome.style.visibility = "hidden";
            content.style.opacity = "1";
        }
    </script>

</body>
</html>
