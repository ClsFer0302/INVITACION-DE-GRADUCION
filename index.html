<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Pantalla de interacción para habilitar el audio de fondo */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdf2f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        #welcome-screen h1 {
            color: #d27d9a;
            font-size: 26px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .enter-btn {
            background: #d27d9a;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(210, 125, 154, 0.4);
            transition: transform 0.2s;
        }
        .enter-btn:active {
            transform: scale(0.95);
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 430px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        /* Zona interactiva alineada al botón de ubicación */
        .maps-link {
            position: absolute;
            left: 10%;
            top: 74%;
            width: 80%;
            height: 9%;
            z-index: 20;
            cursor: pointer; 
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Entrada Interactiva -->
    <div id="welcome-screen">
        <h1>🎓 Estás invitado a la<br>Graduación de Kenia</h1>
        <button class="enter-btn" onclick="startInvitation()">Abrir Invitación</button>
    </div>

    <!-- Contenedor Principal de la Invitación -->
    <div class="container" id="main-content">
        <img class="invitation" src="Invitacion_Kenia_Boton_Maps_page-0001.jpg" onerror="this.src='Invitacion_Kenia_Boton_Maps_page-0001.JPG'" alt="Invitación de Graduación de Kenia">
        <!-- URL de Maps corregida y depurada para redirección a San Rafael Chamapa -->
        <a class="maps-link" href="https://google.com" target="_blank"></a>
    </div>

    <script>
        // Inicialización del objeto global de audio para evitar bloqueos en smartphones
        var audioContext = new (window.AudioContext || window.webkitAudioContext)();
        var backgroundMusic = new Audio('cancion.mp3');
        backgroundMusic.loop = true;

        function startInvitation() {
            // Desbloqueo del hilo de audio del navegador tras acción de usuario
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            backgroundMusic.play().catch(function(error) {
                console.log("Control de reproducción bloqueado:", error);
            });

            var welcome = document.getElementById("welcome-screen");
            var content = document.getElementById("main-content");
            
            welcome.style.opacity = "0";
            welcome.style.visibility = "hidden";
            content.style.opacity = "1";
        }
    </script>

</body>
</html>
