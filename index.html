<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Graduación</title>
    <style>
        /* Estilos básicos para centrar el contenido */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        .btn-ubicacion {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. TEXTO DE LA FECHA (Sin cuenta regresiva) -->
    <h1>¡Estás invitado a mi Graduación!</h1>
    <h2>Fecha: 6 de Septiembre a las 3:00 PM</h2>

   <!-- Botón con tu enlace exacto de Maps -->
        <a href="https://goo.gl" target="_blank" class="btn-ubicacion">
            📍 Ver Ubicación en el Mapa
        </a>
    </div>

    <!-- 3. MÚSICA DE FONDO (YouTube) -->
    <!-- El reproductor es invisible (width:0, height:0) y tiene activación automática -->
    <iframe width="0" height="0" 
            src="https://youtube.com" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>

</body>
</html>
