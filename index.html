<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Pantalla de bienvenida interactiva obligatoria */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdf2f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #welcome-screen h1 {
            color: #d27d9a;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
        }
        .enter-btn {
            background: #d27d9a;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(210, 125, 154, 0.4);
        }

        /* Contenedor responsivo calibrado */
        .container {
            position: relative;
            width: 100%;
            max-width: 410px;
            height: auto;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            image-rendering: -webkit-optimize-contrast;
        }
        
        /* Botón de Google Maps Clavado encima de tu zona rosa */
        .maps-link {
            position: absolute;
            left: 15%;
            bottom: 16.5%; 
            width: 70%;
            height: 8.5%;
            z-index: 999;
            cursor: pointer; 
            border-radius: 30px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Pantalla de entrada para activar música -->
    <div id="welcome-screen">
        <h1>🎓 Estás invitado a la<br>Graduación de Kenia</h1>
        <button class="enter-btn" onclick="startInvitation()">Abrir Invitación</button>
    </div>

    <!-- Invitación Principal -->
    <div class="container" id="main-content">
        <img class="invitation" src="Invitacion_Kenia_Boton_Maps_page-0001.jpg" onerror="this.src='Invitacion_Kenia_Boton_Maps_page-0001.JPG'" alt="Invitación">
        
        <!-- CORRECCIÓN DEL MAPA: Enlace profundo universal para forzar la apertura de la App de Google Maps sin usar JavaScript -->
        <a class="maps-link" href="https://google.com" target="_blank"></a>
    </div>

    <!-- CORRECCIÓN DE AUDIO: Forzado mediante Streaming Nativo -->
    <audio id="bg-music" loop preload="auto" crossorigin="anonymous">
        <source src="Cancion.mp3" type="audio/mpeg">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startInvitation() {
            var music = document.getElementById("bg-music");
            
            // Lógica forzada de desbloqueo de canales de audio móviles
            music.load();
            var playPromise = music.play();

            if (playPromise !== undefined) {
                playPromise.then(function() {
                    console.log("Música iniciada");
                }).catch(function(error) {
                    console.log("Reintentando reproducción...", error);
                    // Segundo intento de respaldo por si el teléfono bloquea la carga directa
                    setTimeout(function(){
                        music.play();
                    }, 100);
                });
            }

            // Cambiar de pantalla
            var welcome = document.getElementById("welcome-screen");
            var content = document.getElementById("main-content");
            
            welcome.style.opacity = "0";
            welcome.style.visibility = "hidden";
            content.style.opacity = "1";
        }
    </script>

</body>
</html>
