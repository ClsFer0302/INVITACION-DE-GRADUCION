<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduación de Kenia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 430px;
        }
        .invitation {
            width: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
        }
        /* Zona clicable interactiva sobre el botón rosa de la imagen */
        .maps-link {
            position: absolute;
            left: 25%;
            top: 63%;
            width: 50%;
            height: 7%;
            z-index: 20;
            cursor: pointer; 
        }
        .spotify-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #1DB954;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 18px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,.25);
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen vinculada correctamente con su nombre en el servidor -->
        <img class="invitation" src="invitacion.jpg" alt="Invitación de Graduación de Kenia">
        
        <!-- Enlace invisible para redirección a Google Maps -->
        <a class="maps-link" href="https://google.com" target="_blank"></a>
    </div>

    <!-- Botón flotante musical de Spotify -->
    <a class="spotify-btn" href="https://spotify.com" target="_blank">
        🎵 Dancing Queen
    </a>

</body>
</html>
